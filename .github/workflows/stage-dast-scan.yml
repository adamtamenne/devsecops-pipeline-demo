name: DAST Scan

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker image name to build and run"
        required: false
        default: "devsecops-demo"
        type: string
      dockerfile-path:
        description: "Path to Dockerfile build context"
        required: false
        default: "./app"
        type: string
      target-port:
        description: "Application port to scan"
        required: false
        default: "5000"
        type: string
      zap-config:
        description: "ZAP rules configuration file"
        required: false
        default: "security/zap-config.yaml"
        type: string

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the application
        run: |
          docker build -t ${{ inputs.image-name }}:${{ github.sha }} ${{ inputs.dockerfile-path }}
          docker run -d -p ${{ inputs.target-port }}:${{ inputs.target-port }} --name demo-app ${{ inputs.image-name }}:${{ github.sha }}
          # Wait for the app to be ready
          for i in $(seq 1 30); do
            curl -s http://localhost:${{ inputs.target-port }}/health && break
            sleep 1
          done

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:${{ inputs.target-port }}"
          rules_file_name: ${{ inputs.zap-config }}
          cmd_options: "-a"
          allow_issue_writing: false

      - name: Stop application
        if: always()
        run: docker stop demo-app && docker rm demo-app
