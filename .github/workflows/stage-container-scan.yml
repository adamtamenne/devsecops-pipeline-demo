name: Container Scan

on:
  workflow_call:
    inputs:
      image-name:
        description: "Docker image name to build and scan"
        required: false
        default: "devsecops-demo"
        type: string
      dockerfile-path:
        description: "Path to Dockerfile build context"
        required: false
        default: "./app"
        type: string
      severity:
        description: "Severity levels to scan for"
        required: false
        default: "CRITICAL,HIGH"
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ inputs.image-name }}:${{ github.sha }} ${{ inputs.dockerfile-path }}

      - name: Run Trivy vulnerability scanner
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ inputs.image-name }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.severity }}
          exit-code: "1"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
